<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <!-- <link rel="stylesheet" href="css/bootstrap-icons.min.css"> -->
    </head>
    <body>
        <script src="js/jquery.min.js"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
        <div class="container w-50 mt-5" style="position: relative;">
            <h4 class="mb-2 mt-0" style="text-align: left; font-family: consolas;">Block 134</h4>
            <div class="box mt-0">规则: PvE, 你先手, 每次可以拿 1 或 3 或 4 个方块，谁拿到最后一个谁赢.</div>
            <p class="cell-hint">方块个数: <span>20</span><span id="win-lose"></span><span id="win-tip">赢不了？</span></p>
            <input class="cell-num" type="range" max="50" min="1" step="1" value="20"/>
            <div class="oper">
                <div class="box" id="start">Start</div>
                <div class="box" id="pick1">Pick 1</div>
                <div class="box" id="pick3">Pick 3</div>
                <div class="box" id="pick4">Pick 4</div>
            </div>
            <div class="cell-grid">
            </div>
        </div>
        <script src="js/index.js"></script>
    </body>
</html>
